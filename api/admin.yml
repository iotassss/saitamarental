openapi: 3.0.0
info:
  title: Rent Comparison API
  description: API for rent comparison and city management
  version: 1.0.0
servers:
  - url: https://api.example.com

paths:
  /admin/cities:
    get:
      summary: Get all cities (admin)
      description: Retrieve a list of all cities for management purposes.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CitySummary'
    post:
      summary: Create a new city (admin)
      description: Add a new city to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDetails'
      responses:
        '201':
          description: City created successfully
  /admin/cities/{id}:
    get:
      summary: Get city details (admin)
      description: Retrieve details of a city for administrative purposes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDetails'
    put:
      summary: Update a city (admin)
      description: Update the details of an existing city.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDetails'
      responses:
        '200':
          description: City updated successfully
    delete:
      summary: Delete a city (admin)
      description: Remove a city from the system.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: City deleted successfully

components:
  schemas:
    CitySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        average_rent:
          type: integer
        properties_count:
          type: integer
    CityDetails:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        average_rent:
          type: integer
        properties_count:
          type: integer
        area_size:
          type: string
        population:
          type: integer
    Property:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        rent:
          type: integer
        size:
          type: string
        nearest_station:
          type: string
